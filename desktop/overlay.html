<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINGUA · 框选屏幕</title>
  <style>
    :root {
      --accent: #6ee7d8;
      --gold: #ffcf73;
      --text: #f4f8fb;
      --muted: #a9b9c7;
      --bg: #02060b;
      --font: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #shot {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    body:not(.ready) #shot {
      opacity: 0;
    }
    body:not(.ready)::after {
      position: fixed;
      inset: 0;
      content: "正在准备屏幕画面…";
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .05em;
    }
    #dim {
      position: fixed;
      inset: 0;
      background: rgba(2, 7, 12, .18);
      pointer-events: none;
      transition: opacity .12s ease;
    }
    body.dragging #dim {
      opacity: 0;
    }
    #hint {
      position: fixed;
      top: 22px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      color: var(--text);
      border: 1px solid rgba(175, 213, 236, .22);
      border-radius: 11px;
      background: rgba(6, 13, 21, .9);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .32);
      font-size: 11px;
      letter-spacing: .01em;
      transform: translateX(-50%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
      z-index: 10;
      transition: opacity .12s ease, transform .12s ease;
    }
    #hint strong {
      color: var(--accent);
      font-weight: 600;
    }
    #hint .divider {
      width: 1px;
      height: 14px;
      background: rgba(175, 213, 236, .18);
    }
    #hint .tip {
      color: var(--muted);
      font-size: 9px;
    }
    kbd {
      display: inline-flex;
      min-width: 20px;
      height: 19px;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      color: var(--muted);
      border: 1px solid rgba(175, 213, 236, .24);
      border-radius: 5px;
      background: rgba(255, 255, 255, .05);
      font-family: var(--mono);
      font-size: 8px;
    }
    body.dragging #hint {
      opacity: 0;
    }
    #selection {
      position: absolute;
      display: none;
      border: 1.5px solid var(--accent);
      border-radius: 3px;
      background: rgba(110, 231, 216, .045);
      box-shadow: 0 0 0 100vmax rgba(2, 7, 12, .46), 0 0 0 1px rgba(2, 7, 12, .28), 0 0 30px rgba(110, 231, 216, .12);
      z-index: 5;
      pointer-events: none;
    }
    #selection::before,
    #selection::after {
      position: absolute;
      width: 9px;
      height: 9px;
      content: "";
      border-color: var(--accent);
      border-style: solid;
    }
    #selection::before {
      top: -3px;
      left: -3px;
      border-width: 2px 0 0 2px;
    }
    #selection::after {
      right: -3px;
      bottom: -3px;
      border-width: 0 2px 2px 0;
    }
    #size {
      position: absolute;
      bottom: 8px;
      left: 50%;
      padding: 3px 7px;
      color: var(--text);
      border: 1px solid rgba(175, 213, 236, .18);
      border-radius: 5px;
      background: rgba(4, 10, 17, .84);
      font-family: var(--mono);
      font-size: 8px;
      white-space: nowrap;
      transform: translateX(-50%);
      backdrop-filter: blur(8px);
    }
    #corner-tip {
      position: fixed;
      right: 22px;
      bottom: 20px;
      color: rgba(219, 233, 243, .55);
      font-size: 9px;
      letter-spacing: .03em;
      pointer-events: none;
      z-index: 9;
    }
    #corner-tip kbd {
      height: 17px;
      font-size: 7px;
    }
    body.dragging #corner-tip {
      opacity: 0;
    }
    #inline-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    .inline-block {
      position: absolute;
      padding: 1px 5px;
      color: #19222c;
      border: 1px solid rgba(19, 122, 114, .16);
      border-left: 2px solid #137a72;
      border-radius: 3px;
      background: rgba(255, 255, 255, .90);
      box-shadow: 0 1px 4px rgba(15, 33, 40, .14);
      font-family: var(--font);
      font-weight: 600;
      line-height: 1.38;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      opacity: var(--inline-ui-opacity, .8);
      pointer-events: none;
    }
    #inline-status {
      position: fixed;
      top: 20px;
      left: 50%;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      color: #3c4855;
      border: 1px solid rgba(19, 122, 114, .18);
      border-radius: 8px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 8px 24px rgba(15, 33, 40, .16);
      font-family: var(--font);
      font-size: 10px;
      transform: translateX(-50%);
      opacity: var(--inline-ui-opacity, .8);
      z-index: 30;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #inline-status::before {
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 50%;
      background: #137a72;
      animation: inline-pulse 1.2s ease infinite;
    }
    #inline-status.is-error {
      color: #a33b45;
      border-color: rgba(192, 71, 81, .30);
      background: rgba(255, 248, 248, .94);
    }
    #inline-status.is-error::before { background: #c04751; }
    @keyframes inline-pulse {
      50% { opacity: .35; }
    }
    #inline-hint {
      position: fixed;
      right: auto;
      bottom: 22px;
      left: 50%;
      display: none;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      color: #3c4855;
      border: 1px solid rgba(19, 122, 114, .18);
      border-radius: 8px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 8px 24px rgba(15, 33, 40, .16);
      font-family: var(--font);
      font-size: 10px;
      letter-spacing: .02em;
      transform: translateX(-50%);
      opacity: var(--inline-ui-opacity, .8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 30;
      pointer-events: none;
    }
    #inline-hint kbd {
      height: 20px;
      min-width: 30px;
      color: #137a72;
      border-color: #cfe7e2;
      background: #eef8f5;
      font-size: 8px;
    }
    body.inline #dim,
    body.inline #hint,
    body.inline #selection,
    body.inline #corner-tip {
      display: none !important;
    }
    body.inline {
      height: var(--inline-canvas-height, 100vh);
      overflow-x: hidden;
      overflow-y: auto;
      cursor: default;
    }
    body.inline #shot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      object-fit: fill;
    }
    body.inline #inline-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--inline-canvas-height, 100vh);
    }
    body.inline #inline-status { display: flex; }
    body.inline #inline-hint { display: flex; }

    /* ---- soft anime overlay ---- */
    :root {
      --accent: #a18fdf;
      --gold: #d4a75f;
      --text: #4a415e;
      --muted: #8e80a3;
      --bg: #f7f3fb;
    }
    #dim {
      background: rgba(58, 48, 78, .16);
    }
    #hint {
      color: #5a4d70;
      border-color: rgba(219, 202, 238, .85);
      border-radius: 14px;
      background: rgba(255, 253, 255, .92);
      box-shadow: 0 14px 36px rgba(62, 48, 84, .18);
    }
    #hint strong { color: #8a76cf; }
    #hint .tip { color: #9e90b2; }
    #hint .divider { background: #eadff4; }
    #hint kbd {
      color: #8a76cf;
      border-color: #e5d8f3;
      background: #f8f2ff;
    }
    #selection {
      border-color: #a18fdf;
      border-radius: 6px;
      background: rgba(161, 143, 223, .055);
      box-shadow: 0 0 0 100vmax rgba(38, 30, 52, .38), 0 0 0 1px rgba(255, 255, 255, .28), 0 0 34px rgba(161, 143, 223, .22);
    }
    #selection::before,
    #selection::after {
      border-color: #b7a6e8;
    }
    #size {
      color: #5a4d70;
      border-color: rgba(219, 202, 238, .9);
      background: rgba(255, 253, 255, .94);
      border-radius: 7px;
    }
    #corner-tip {
      color: rgba(255, 255, 255, .88);
      text-shadow: 0 1px 6px rgba(38, 28, 54, .65);
    }
    #corner-tip kbd {
      color: #6b5c82;
      border-color: #eadff4;
      background: rgba(255, 253, 255, .90);
    }
    .inline-block {
      color: #403851;
      border-color: #ebe0f5;
      border-left-color: #a18fdf;
      border-radius: 5px;
      background: rgba(255, 253, 255, .94);
      box-shadow: 0 2px 8px rgba(75, 55, 105, .16);
    }
    #inline-status {
      color: #6b5c82;
      border-color: #e7daf3;
      border-radius: 10px;
      background: rgba(255, 253, 255, .94);
      box-shadow: 0 10px 28px rgba(65, 48, 90, .18);
    }
    #inline-status::before { background: #a18fdf; }
    #inline-status.is-error {
      color: #a34a62;
      border-color: #efcbd6;
      background: rgba(255, 248, 250, .96);
    }
    #inline-status.is-error::before { background: #c25e77; }
    #inline-hint {
      color: #6b5c82;
      border-color: #e7daf3;
      border-radius: 10px;
      background: rgba(255, 253, 255, .94);
      box-shadow: 0 10px 28px rgba(65, 48, 90, .18);
    }
    #inline-hint kbd {
      color: #8a76cf;
      border-color: #e5d8f3;
      background: #f8f2ff;
    }
  </style>
</head>
<body>
  <img id="shot" alt="">
  <div id="dim"></div>
  <div id="hint">
    <strong id="hintTitle">拖动框选</strong>
    <span id="hintTarget">要翻译的屏幕区域</span>
    <span class="divider"></span>
    <span class="tip" id="hintTip">松开鼠标后自动识别</span>
    <span class="divider"></span>
    <kbd>Esc</kbd><span class="tip">取消</span>
  </div>
  <div id="selection"><span id="size"></span></div>
  <div id="corner-tip"><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>F2</kbd> 随时重新框选</div>
  <div id="inline-layer"></div>
  <div id="inline-status">正在识别并翻译…</div>
  <div id="inline-hint"><kbd>Esc</kbd><span>关闭翻译并返回</span></div>
  <script>
    (() => {
      'use strict';
      const shot = document.getElementById('shot');
      const selection = document.getElementById('selection');
      const sizeLabel = document.getElementById('size');
      const inlineLayer = document.getElementById('inline-layer');
      const inlineStatus = document.getElementById('inline-status');
      const inlineHint = document.getElementById('inline-hint');
      let inlineSelection = null;
      let start = null;
      let dragging = false;
      let finalizing = false;

      window.overlayAPI.onInit(({ dataUrl, hotkey, auto }) => {
        shot.onload = () => document.body.classList.add('ready');
        shot.onerror = () => document.body.classList.add('ready');
        shot.src = dataUrl;
        if (auto) {
          document.getElementById('hintTitle').textContent = '拖动框选';
          document.getElementById('hintTarget').textContent = '自动翻译区域';
          document.getElementById('hintTip').textContent = '松开后持续翻译';
        }
        if (typeof hotkey === 'string' && hotkey.trim()) {
          const labels = { Control: 'Ctrl', Command: 'Cmd', Super: 'Win' };
          const keys = hotkey.split('+').map((part) => labels[part] || part);
          const corner = document.getElementById('corner-tip');
          corner.textContent = '';
          keys.forEach((key) => {
            const kbd = document.createElement('kbd');
            kbd.textContent = key;
            corner.appendChild(kbd);
            corner.appendChild(document.createTextNode(' '));
          });
          corner.appendChild(document.createTextNode('随时重新框选'));
        }
      });

      window.overlayAPI.onInlineBegin(({ selection: selected, opacity }) => {
        inlineSelection = selected || null;
        inlineLayer.textContent = '';
        const labelOpacity = Number(opacity);
        const uiOpacity = Number.isFinite(labelOpacity)
          ? Math.max(0.2, Math.min(1, labelOpacity))
          : 0.8;
        document.body.style.setProperty('--inline-ui-opacity', String(uiOpacity));
        document.body.style.setProperty('--inline-canvas-height', '100vh');
        inlineHint.querySelector('span').textContent = '关闭翻译并返回';
        window.scrollTo(0, 0);
        inlineStatus.textContent = '正在识别并翻译…';
        inlineStatus.classList.remove('is-error');
        inlineStatus.style.display = 'flex';
        document.body.classList.add('inline');
      });

      window.overlayAPI.onInlineStatus(({ text, error }) => {
        if (!document.body.classList.contains('inline')) return;
        inlineStatus.style.display = 'flex';
        inlineStatus.classList.toggle('is-error', !!error);
        inlineStatus.textContent = text || (error ? '翻译失败' : '正在识别并翻译…');
      });

      window.overlayAPI.onInlineBlocks(({ blocks }) => {
        if (!document.body.classList.contains('inline')) return;
        inlineLayer.textContent = '';
        inlineStatus.style.display = 'none';
        inlineStatus.classList.remove('is-error');
        const source = inlineSelection || { x: 0, y: 0, width: window.innerWidth, height: window.innerHeight };
        const list = Array.isArray(blocks) ? blocks.slice() : [];
        list.sort((a, b) => (a.y + a.h) - (b.y + b.h) || a.x - b.x);

        const W = window.innerWidth;
        const H = window.innerHeight;
        const MAX_CANVAS = Math.max(5000, H * 5);
        const gap = 4;
        const edges = 4;
        let maxBottom = 0;
        const overlaps = (a, b) => (
          a.left < b.right - 0.5 &&
          a.right > b.left + 0.5 &&
          a.top < b.bottom - 0.5 &&
          a.bottom > b.top + 0.5
        );

        const sourceRects = list.map((block) => {
          const left = source.x + Number(block.x || 0) * source.width;
          const top = source.y + Number(block.y || 0) * source.height;
          const width = Number(block.w || 0) * source.width;
          const height = Number(block.h || 0) * source.height;
          return {
            left,
            top,
            right: left + width,
            bottom: top + height,
            width,
            height
          };
        });
        const obstacles = sourceRects.map((rect) => ({ ...rect }));
        const hintRect = document.getElementById('inline-hint').getBoundingClientRect();
        if (hintRect.width > 0 && hintRect.height > 0) {
          obstacles.push({
            left: hintRect.left - 4,
            top: hintRect.top - 4,
            right: hintRect.right + 4,
            bottom: hintRect.bottom + 4
          });
        }

        const canPlace = (rect) => (
          rect.left >= edges &&
          rect.top >= edges &&
          rect.right <= W - edges &&
          rect.bottom <= MAX_CANVAS - edges &&
          !obstacles.some((obstacle) => overlaps(rect, obstacle))
        );

        for (let index = 0; index < list.length; index++) {
          const block = list[index];
          const text = String(block.text || '').trim();
          if (!text) continue;
          const sourceRect = sourceRects[index];
          const node = document.createElement('div');
          node.className = 'inline-block';
          node.textContent = text;
          node.style.visibility = 'hidden';
          inlineLayer.appendChild(node);

          const baseLeft = Math.max(edges, Math.min(W - 80, sourceRect.left));
          const baseWidth = Math.max(80, Math.min(W - baseLeft - 10, sourceRect.width));
          const baseFont = Math.max(10, Math.min(18, sourceRect.height * 0.58));
          let finalRect = null;

          // Try the natural position below the source first, then above it.
          // If those are occupied, widen/shrink the label and retry.
          for (let attempt = 0; attempt < 5 && !finalRect; attempt++) {
            const width = Math.min(W - baseLeft - 10, baseWidth + attempt * 36);
            const fontSize = Math.max(9, baseFont - attempt * 1.5);
            node.style.width = `${Math.max(80, Math.round(width))}px`;
            node.style.fontSize = `${Math.round(fontSize)}px`;
            const measured = node.getBoundingClientRect();
            const labelWidth = Math.max(80, Math.round(measured.width));
            const labelHeight = Math.max(18, Math.round(measured.height));

            for (let top = sourceRect.bottom + gap; top + labelHeight <= MAX_CANVAS - edges; top += 3) {
              const rect = {
                left: baseLeft,
                top,
                right: baseLeft + labelWidth,
                bottom: top + labelHeight
              };
              if (canPlace(rect)) { finalRect = rect; break; }
            }

            if (!finalRect) {
              for (let top = sourceRect.top - labelHeight - gap; top >= edges; top -= 3) {
                const rect = {
                  left: baseLeft,
                  top,
                  right: baseLeft + labelWidth,
                  bottom: top + labelHeight
                };
                if (canPlace(rect)) { finalRect = rect; break; }
              }
            }

            if (!finalRect) {
              for (const candidateLeft of [
                sourceRect.right + gap,
                sourceRect.left - labelWidth - gap,
                8
              ]) {
                if (candidateLeft < edges || candidateLeft + labelWidth > W - edges) continue;
                for (let top = Math.max(edges, sourceRect.top); top + labelHeight <= MAX_CANVAS - edges; top += 4) {
                  const rect = {
                    left: candidateLeft,
                    top,
                    right: candidateLeft + labelWidth,
                    bottom: top + labelHeight
                  };
                  if (canPlace(rect)) { finalRect = rect; break; }
                }
                if (finalRect) break;
              }
            }
          }

          if (!finalRect) {
            // Last resort: scan for any free area instead of drawing on top
            // of another translation or an original text box.
            node.style.width = `${Math.max(80, Math.round(baseWidth))}px`;
            node.style.fontSize = `${Math.max(9, Math.round(baseFont))}px`;
            const measured = node.getBoundingClientRect();
            const labelWidth = Math.max(80, Math.round(measured.width));
            const labelHeight = Math.max(18, Math.round(measured.height));
            for (let top = edges; top + labelHeight <= MAX_CANVAS - edges && !finalRect; top += 4) {
              for (let left = edges; left + labelWidth <= W - edges; left += 8) {
                const rect = { left, top, right: left + labelWidth, bottom: top + labelHeight };
                if (canPlace(rect)) { finalRect = rect; break; }
              }
            }
          }

          if (!finalRect) {
            node.remove();
            continue;
          }
          node.style.left = `${Math.round(finalRect.left)}px`;
          node.style.top = `${Math.round(finalRect.top)}px`;
          node.style.visibility = 'visible';
          obstacles.push({ ...finalRect });
          maxBottom = Math.max(maxBottom, finalRect.bottom);
        }

        const canvasHeight = Math.max(H, Math.ceil(maxBottom + 40));
        document.body.style.setProperty('--inline-canvas-height', `${canvasHeight}px`);
        if (canvasHeight > H + 1) {
          inlineHint.querySelector('span').textContent = '滚动查看全部 · 关闭';
        }
      });

      function point(event) {
        return {
          x: Math.max(0, Math.min(window.innerWidth, event.clientX)),
          y: Math.max(0, Math.min(window.innerHeight, event.clientY))
        };
      }

      function update(startPoint, endPoint) {
        const x = Math.min(startPoint.x, endPoint.x);
        const y = Math.min(startPoint.y, endPoint.y);
        const width = Math.abs(endPoint.x - startPoint.x);
        const height = Math.abs(endPoint.y - startPoint.y);
        selection.style.left = `${x}px`;
        selection.style.top = `${y}px`;
        selection.style.width = `${width}px`;
        selection.style.height = `${height}px`;
        selection.style.display = width >= 2 && height >= 2 ? 'block' : 'none';
        sizeLabel.textContent = `${Math.round(width)} × ${Math.round(height)}`;
        return { x, y, width, height };
      }

      document.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || finalizing) return;
        if (event.button === 2) return;
        start = point(event);
        dragging = true;
        document.body.classList.add('dragging');
        selection.style.display = 'block';
        update(start, start);
        try { document.body.setPointerCapture(event.pointerId); } catch (error) { /* ignored */ }
        event.preventDefault();
      });

      document.addEventListener('pointermove', (event) => {
        if (!dragging || !start) return;
        update(start, point(event));
        event.preventDefault();
      });

      document.addEventListener('pointerup', (event) => {
        if (!dragging || !start || finalizing) return;
        dragging = false;
        const end = point(event);
        const rect = update(start, end);
        document.body.classList.remove('dragging');
        if (rect.width < 10 || rect.height < 10) {
          start = null;
          selection.style.display = 'none';
          return;
        }
        finalizing = true;
        window.overlayAPI.select({
          ...rect,
          viewportWidth: window.innerWidth,
          viewportHeight: window.innerHeight
        });
      });

      document.addEventListener('pointercancel', () => {
        dragging = false;
        start = null;
        selection.style.display = 'none';
        document.body.classList.remove('dragging');
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          window.overlayAPI.cancel();
        }
      });

      document.addEventListener('contextmenu', (event) => {
        event.preventDefault();
        if (!finalizing) window.overlayAPI.cancel();
      });
    })();
  </script>
</body>
</html>
