<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINGUA · 译文</title>
  <style>
    :root {
      --accent: #137a72;
      --gold: #b27d27;
      --text: #19222c;
      --soft: #3c4855;
      --muted: #6c7a88;
      --faint: #98a4b0;
      --danger: #c04751;
      --bg: #ffffff;
      --font: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: var(--font);
      color: var(--text);
      user-select: text;
      -webkit-user-select: text;
    }
    .card {
      position: relative;
      display: flex;
      height: 100%;
      margin: 0;
      padding: 10px 12px 8px;
      overflow: hidden;
      flex-direction: column;
      border: 1px solid #e5e9ed;
      border-top: 2px solid var(--accent);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(25, 34, 44, .10);
      cursor: move;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 22px;
    }
    .direction {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 9px;
      font-weight: 500;
      white-space: nowrap;
    }
    .direction .arrow {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
    }
    #sourceLabel {
      max-width: 120px;
      overflow: hidden;
      color: var(--soft);
      text-overflow: ellipsis;
    }
    #targetLabel {
      max-width: 100px;
      overflow: hidden;
      color: var(--accent);
      text-overflow: ellipsis;
    }
    .auto-badge {
      display: inline-flex;
      height: 17px;
      align-items: center;
      margin-left: 3px;
      padding: 0 5px;
      color: var(--accent);
      border: 1px solid #cfe8e3;
      border-radius: 4px;
      background: #edf8f5;
      font-family: var(--font-mono);
      font-size: 6.5px;
      letter-spacing: .02em;
    }
    .close {
      display: grid;
      width: 23px;
      height: 23px;
      flex: none;
      place-items: center;
      color: var(--faint);
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
    }
    .close:hover {
      color: var(--text);
      border-color: #e1e6eb;
      background: #f4f7f8;
    }
    .original-block {
      flex: none;
      max-height: 88px;
      margin: 6px 0 4px;
      padding: 6px 8px;
      overflow: auto;
      border: 1px solid #edf1f4;
      border-radius: 6px;
      background: #f7f9fa;
      scrollbar-width: thin;
    }
    .original-label {
      display: block;
      margin-bottom: 2px;
      color: var(--faint);
      font-size: 7px;
      font-weight: 600;
      letter-spacing: .08em;
    }
    .original-text {
      max-height: 62px;
      overflow: auto;
      color: var(--soft);
      font-size: 10.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      scrollbar-width: thin;
    }
    .content {
      display: flex;
      min-height: 0;
      flex: 1;
      align-items: flex-start;
      flex-direction: column;
      justify-content: center;
      padding: 4px 0 7px;
      overflow: hidden;
    }
    .loading {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 11px;
    }
    .spinner {
      width: 16px;
      height: 16px;
      flex: none;
      border: 1.5px solid #dbe9e6;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .translation {
      display: none;
      width: 100%;
      max-height: 100%;
      overflow-y: auto;
      color: var(--text);
      font-size: 15px;
      font-weight: 450;
      line-height: 1.65;
      letter-spacing: -.01em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      scrollbar-width: thin;
      scrollbar-color: rgba(149, 192, 216, .25) transparent;
    }
    .translation.is-visible { display: block; }
    .error {
      display: none;
      width: 100%;
      color: var(--danger);
      font-size: 11px;
      line-height: 1.6;
    }
    .error.is-visible { display: block; }
    .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid #e9edf1;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 7px;
      letter-spacing: .08em;
    }
    .brand i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(110, 231, 216, .1);
    }
    .foot-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .copy.stop-auto {
      color: var(--danger);
      border-color: #f0d7d9;
      background: #fffafa;
    }
    .copy.stop-auto:hover:not(:disabled) {
      color: var(--danger);
      border-color: #e6c3c6;
      background: #fdf2f2;
    }
    .copy {
      height: 24px;
      padding: 0 8px;
      color: var(--muted);
      border: 1px solid #e1e6eb;
      border-radius: 6px;
      background: #fff;
      font-family: var(--font);
      font-size: 8px;
      cursor: pointer;
    }
    .copy:hover:not(:disabled) {
      color: var(--accent);
      border-color: #c9e2dd;
      background: #f5faf8;
    }
    .copy:disabled { opacity: .35; cursor: default; }
    .copy.is-copied { color: var(--accent); border-color: #c9e2dd; }
    .inline-hint {
      display: none;
      position: absolute;
      right: 10px;
      bottom: 5px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 6.5px;
      letter-spacing: .02em;
    }
    .inline .head,
    .inline .foot,
    .inline .original-block {
      display: none !important;
    }
    .inline .card {
      padding: 8px 14px 19px;
      border: 0;
      border-radius: 3px;
      background: #fbfcfd;
      box-shadow: none;
    }
    .inline .content {
      justify-content: flex-start;
      padding: 0;
    }
    .inline .translation {
      font-size: 16px;
      line-height: 1.65;
    }
    .inline .loading,
    .inline .error {
      font-size: 12px;
    }
    .inline .inline-hint {
      display: block;
    }
    ::selection { color: #fff; background: var(--accent); }

    /* ---- soft anime result card ---- */
    :root {
      --accent: #9b8dde;
      --gold: #d4a75f;
      --text: #423a56;
      --soft: #625878;
      --muted: #8d82a1;
      --faint: #b1a5c2;
      --danger: #c25e77;
      --bg: #fffdfd;
    }
    html, body {
      background: #fffdfd;
    }
    .card {
      border: 1px solid #eadff4;
      border-top: 2px solid #b3a2e4;
      border-radius: 16px;
      background:
        radial-gradient(120% 100% at 100% 0%, rgba(255, 218, 236, .30), transparent 60%),
        linear-gradient(160deg, #fffdfd, #fbf6ff);
      box-shadow: 0 14px 36px rgba(123, 98, 162, .16);
    }
    #sourceLabel { color: #7e7092; }
    #targetLabel { color: #8a76cf; }
    .auto-badge {
      color: #8a76cf;
      border-color: #e0d2f2;
      background: #f4eeff;
      border-radius: 6px;
    }
    .close:hover {
      color: #55486c;
      border-color: #ebdff5;
      background: #faf5ff;
    }
    .original-block {
      border-color: #f0e5f7;
      border-radius: 10px;
      background: #fcf8ff;
    }
    .original-label { color: #b0a2c0; }
    .original-text { color: #746680; }
    .spinner {
      border-color: #eadff4;
      border-top-color: #a18fdf;
    }
    .translation {
      color: #403851;
      scrollbar-color: #d9cbe9 transparent;
    }
    .foot { border-top-color: #f1e8f8; }
    .brand { color: #ab9dbd; }
    .brand i {
      background: #a18fdf;
      box-shadow: 0 0 0 2px rgba(161, 143, 223, .13);
    }
    .copy {
      border-color: #eadff3;
      border-radius: 8px;
      background: #fffaff;
      color: #8e80a4;
    }
    .copy:hover:not(:disabled) {
      color: #8a76cf;
      border-color: #d9c8ee;
      background: #f7f1ff;
    }
    .copy.is-copied {
      color: #8a76cf;
      border-color: #d9c8ee;
    }
    .inline .card {
      border-radius: 14px;
      background: linear-gradient(160deg, #fffdfd, #fbf6ff);
    }
    .inline .translation { color: #403851; }
  </style>
</head>
<body>
  <main class="card" id="card" title="按住拖动译文框">
    <header class="head">
      <div class="direction">
        <span id="sourceLabel">自动检测</span>
        <span class="arrow">→</span>
        <span id="targetLabel">译文</span>
        <span class="auto-badge" id="autoBadge" hidden>自动 · 30s</span>
      </div>
      <button class="close" id="closeBtn" type="button" aria-label="关闭译文">×</button>
    </header>
    <div class="original-block" id="originalBlock" hidden>
      <span class="original-label">原文</span>
      <div class="original-text" id="originalText"></div>
    </div>
    <div class="content">
      <div class="loading" id="loading">
        <span class="spinner"></span>
        <span id="loadingText">正在识别屏幕文字…</span>
      </div>
      <div class="translation" id="translation"></div>
      <div class="error" id="error"></div>
    </div>
    <footer class="foot">
      <span class="brand"><i></i><span id="footerStatus">LINGUA · 屏幕翻译</span></span>
      <span class="foot-actions">
        <button class="copy stop-auto" id="stopAutoBtn" type="button" hidden>停止自动</button>
        <button class="copy" id="copyBtn" type="button" disabled>复制译文</button>
      </span>
    </footer>
    <span class="inline-hint" id="inlineHint" hidden>Esc 关闭 · Ctrl+C 复制</span>
  </main>
  <script>
    (() => {
      'use strict';
      const sourceLabel = document.getElementById('sourceLabel');
      const targetLabel = document.getElementById('targetLabel');
      const loading = document.getElementById('loading');
      const loadingText = document.getElementById('loadingText');
      const translation = document.getElementById('translation');
      const originalBlock = document.getElementById('originalBlock');
      const originalText = document.getElementById('originalText');
      const error = document.getElementById('error');
      const footerStatus = document.getElementById('footerStatus');
      const copyBtn = document.getElementById('copyBtn');
      const stopAutoBtn = document.getElementById('stopAutoBtn');
      const autoBadge = document.getElementById('autoBadge');
      const inlineHint = document.getElementById('inlineHint');
      const closeBtn = document.getElementById('closeBtn');
      const card = document.getElementById('card');
      let currentText = '';
      let dragState = null;

      card.addEventListener('pointerdown', (event) => {
        if (event.button !== 0 || event.target.closest('button')) return;
        dragState = {
          pointerId: event.pointerId,
          startScreenX: event.screenX,
          startScreenY: event.screenY,
          startWindowX: window.screenX,
          startWindowY: window.screenY
        };
        try { card.setPointerCapture(event.pointerId); } catch (error) { /* ignored */ }
        event.preventDefault();
      });

      card.addEventListener('pointermove', (event) => {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        const x = Math.round(dragState.startWindowX + event.screenX - dragState.startScreenX);
        const y = Math.round(dragState.startWindowY + event.screenY - dragState.startScreenY);
        window.resultAPI.setPosition(x, y);
      });

      function endDrag() {
        if (!dragState) return;
        try { card.releasePointerCapture(dragState.pointerId); } catch (error) { /* ignored */ }
        dragState = null;
      }
      card.addEventListener('pointerup', endDrag);
      card.addEventListener('pointercancel', endDrag);

      function setState(state) {
        if (!state || typeof state !== 'object') return;
        const isAuto = !!state.auto;
        const isInline = !!state.inline;
        document.body.classList.toggle('inline', isInline);
        card.classList.toggle('inline', isInline);
        inlineHint.hidden = !isInline;
        sourceLabel.textContent = state.sourceLabel || '自动检测';
        targetLabel.textContent = state.targetLabel || '译文';
        autoBadge.hidden = !isAuto;
        stopAutoBtn.hidden = !isAuto;
        closeBtn.title = isAuto ? '关闭并停止自动翻译' : '关闭译文（Esc）';
        const showOriginal = !!state.showOriginal && !!state.original && !isInline;
        originalBlock.hidden = !showOriginal;
        originalText.textContent = showOriginal ? state.original : '';
        if (showOriginal) originalBlock.scrollTop = 0;
        if (state.status === 'success' || state.status === 'streaming') {
          currentText = state.text || '';
          translation.textContent = currentText;
          translation.classList.toggle('is-visible', !!currentText);
          translation.scrollTop = 0;
          loading.style.display = 'none';
          error.classList.remove('is-visible');
          copyBtn.disabled = !currentText;
          footerStatus.textContent = state.autoStatus
            || (state.detected ? `自动检测 · ${state.detected}` : 'LINGUA · 屏幕翻译');
          if (state.status === 'streaming' && !state.autoStatus) footerStatus.textContent = '正在翻译…';
        } else if (state.status === 'error') {
          currentText = '';
          translation.classList.remove('is-visible');
          translation.textContent = '';
          loading.style.display = 'none';
          error.textContent = state.message || '翻译失败，请重试。';
          error.classList.add('is-visible');
          copyBtn.disabled = true;
          footerStatus.textContent = isAuto ? '自动翻译 · 出错了' : '翻译失败';
        } else {
          currentText = '';
          translation.classList.remove('is-visible');
          translation.textContent = '';
          error.classList.remove('is-visible');
          loading.style.display = 'flex';
          loadingText.textContent = state.detail || (isAuto ? '准备自动翻译…' : '正在识别屏幕文字…');
          copyBtn.disabled = true;
          footerStatus.textContent = isAuto
            ? (state.autoStatus || '自动翻译进行中')
            : 'LINGUA · 屏幕翻译';
        }
      }

      async function copyCurrent() {
        if (!currentText) return;
        const ok = await window.resultAPI.copy(currentText);
        if (!ok) return;
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('is-copied');
        if (!inlineHint.hidden) {
          inlineHint.textContent = '已复制';
          window.setTimeout(() => {
            inlineHint.textContent = 'Esc 关闭 · Ctrl+C 复制';
          }, 1200);
        }
        window.setTimeout(() => {
          copyBtn.textContent = '复制译文';
          copyBtn.classList.remove('is-copied');
        }, 1400);
      }

      copyBtn.addEventListener('click', copyCurrent);
      closeBtn.addEventListener('click', () => window.resultAPI.close());
      stopAutoBtn.addEventListener('click', () => window.resultAPI.close());
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          window.resultAPI.close();
          return;
        }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'c' && currentText) {
          event.preventDefault();
          void copyCurrent();
        }
      });

      window.resultAPI.onState(setState);
    })();
  </script>
</body>
</html>
